# 活动日历 · 每天自动搜集新活动（全免费路线）
#
# 每天 00:00 UTC（北京时间 08:00）运行一次，也可手动触发。
# 流程：Tavily 免费搜索 → Gemini 免费版整理 → 校验去重后写入 Supabase。
#
# 首次使用前，先在仓库 Settings → Secrets and variables → Actions 里配置 4 个 Secrets：
#   TAVILY_API_KEY             Tavily 搜索 API 密钥（https://tavily.com 注册，免费额度）
#   GEMINI_API_KEY             Google Gemini API 密钥（https://aistudio.google.com 点 Get API key，免费版）
#   SUPABASE_URL               Supabase 项目 URL
#   SUPABASE_SERVICE_ROLE_KEY  Supabase service_role key（只放 Secrets，绝不进代码）
# 详见 README「自动搜集设置」一节。没配 key 时任务会失败退出，但网站本身完全不受影响。
name: 每日搜集活动情报

on:
  schedule:
    # 每天 00:00 UTC = 北京时间 08:00
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许在 Actions 页面手动点一次，验证是否配置正确

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 搜集并写入新活动
        run: node scripts/collect.mjs
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
